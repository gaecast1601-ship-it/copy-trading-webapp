<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copy Trading</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}
body{margin:0;padding:24px 18px;font-family:system-ui,sans-serif;background:var(--tg-theme-bg-color,#111827);color:var(--tg-theme-text-color,#f9fafb)}
main{max-width:520px;margin:auto}.brand{font-size:13px;letter-spacing:.16em;opacity:.7;font-weight:700}
h1{font-size:28px;margin:10px 0 8px}p{color:var(--tg-theme-hint-color,#9ca3af);line-height:1.5}
.card{margin-top:24px;padding:20px;border-radius:18px;background:var(--tg-theme-secondary-bg-color,#1f2937)}
.status{display:inline-block;border-radius:999px;padding:6px 10px;background:#334155;font-size:12px}
.status.ok{background:#166534}.status.err{background:#7f1d1d}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(148,163,184,.2)}
.row span:first-child{color:var(--tg-theme-hint-color,#9ca3af)}
button{width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;margin-top:18px;color:var(--tg-theme-button-text-color,#fff);background:var(--tg-theme-button-color,#2563eb)}
</style>
</head>
<body>
<main>
<div class="brand">COPY TRADING</div>
<h1 id="hello">Bienvenue 👋</h1>
<p>Ton espace de copy trading.</p>
<section class="card">
<span class="status" id="badge">Connexion en cours…</span>
<h2>Mon compte</h2>
<div id="account"><p id="message">Vérification de ton identité Telegram…</p></div>
<button id="close">Fermer</button>
</section>
</main>
<script>
// Adresse du tunnel : à mettre à jour à chaque nouveau lancement de cloudflared
const API_URL = "https://trains-long-drawing-possibility.trycloudflare.com";

const LABELS = {
  role: {super_admin: "Propriétaire", admin: "Administrateur", user: "Client"},
  status: {pending: "En attente de validation", active: "Actif", revoked: "Révoqué"},
  signal_source: {none: "Aucune source", gael: "Gaël", amin: "Amin et Mathis", both: "Les deux sources"}
};

const tg = window.Telegram && window.Telegram.WebApp;
const badge = document.getElementById("badge");
const account = document.getElementById("account");

function setBadge(text, kind) {
  badge.textContent = text;
  badge.className = "status " + (kind || "");
}

function showMessage(text) {
  account.replaceChildren();
  const p = document.createElement("p");
  p.textContent = text;
  account.appendChild(p);
}

function addRow(label, value) {
  const row = document.createElement("div");
  row.className = "row";
  const a = document.createElement("span");
  const b = document.createElement("span");
  a.textContent = label;
  b.textContent = value;
  row.append(a, b);
  account.appendChild(row);
}

async function loadAccount() {
  if (!tg || !tg.initData) {
    setBadge("Hors Telegram", "err");
    showMessage("Ouvre cette page depuis le bot Telegram pour voir ton compte.");
    return;
  }
  try {
    const res = await fetch(API_URL + "/me", {
      headers: {"Authorization": "tma " + tg.initData}
    });
    const data = await res.json();
    if (!res.ok) {
      setBadge("Accès refusé", "err");
      showMessage(data.detail || "Erreur " + res.status);
      return;
    }
    setBadge("Connecté", "ok");
    account.replaceChildren();
    addRow("Rôle", LABELS.role[data.role] || data.role || "—");
    addRow("Statut", LABELS.status[data.status] || data.status || "—");
    addRow("Signaux", LABELS.signal_source[data.signal_source] || data.signal_source || "—");
  } catch (e) {
    setBadge("API injoignable", "err");
    showMessage("Impossible de joindre le serveur. Le PC, l'API et le tunnel sont-ils allumés ?");
  }
}

if (tg) {
  tg.ready();
  tg.expand();
  if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
    document.getElementById("hello").textContent = "Bonjour " + tg.initDataUnsafe.user.first_name + " 👋";
  }
  document.getElementById("close").addEventListener("click", () => tg.close());
} else {
  document.getElementById("close").textContent = "Page de test";
}

loadAccount();
</script>
</body>
</html>
